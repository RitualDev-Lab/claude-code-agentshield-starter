name: Verify Defense Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  defense-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unit & Defense Tests
        run: npm test

      - name: Audit Repository for Secret Leaks
        run: npx @ritualdev-lab/agentshield scan .
